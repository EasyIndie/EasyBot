# EasyBot 插件入门示例（DX-3 / T19）
#
# 与 `easybot plugin new hello-adapter` 脚手架产出的工程**内容一致**，
# 仅将 SDK git 依赖替换为仓库内 path 依赖、依赖项收口到 workspace，以便
# 作为 workspace 成员被 CI 持续编译（防止示例腐烂）。release profile
# （fat LTO + panic=abort）继承自 workspace，无需重复声明。
#
# 对外发布时请使用脚手架生成独立工程（SDK 走 git tag，作者无需 clone 主仓）。

[package]
name = "hello-adapter"
version = "0.1.0"
edition.workspace = true
description = "Example echo adapter for the EasyBot plugin system (入门示例)"
publish = false

[lib]
# cdylib：宿主用 libloading 进程内加载的共享库。
# rlib：让 `cargo test` 能链接本 crate（integration tests 需要）。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 仓库内 path 依赖 + testing feature（提供 PluginTestHost）。
easybot-plugin-sdk = { path = "../../crates/easybot-plugin-sdk", features = ["testing"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# 真实适配器的 connect 通常需要 tokio::spawn 建轮询/长连接任务（带并发上限）。
tokio.workspace = true

[lints]
workspace = true
