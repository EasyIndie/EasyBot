# EasyBot Stack
#
# Quick start:
#   cp .env.example .env     # Edit tokens — adapters auto-enable when tokens are set
#   docker compose up -d
#   curl 127.0.0.1:8080/api/v1/live
#
# 启用适配器: 只需在下方 environment 或 .env 中设置令牌即可自动启用。
# 无需编辑 gateway.yaml — 系统自动检测已配置凭据的平台。
#
# For monitoring (optional):
#   docker-compose --profile monitoring up -d
#   open http://localhost:9091  # Prometheus

services:
  # Production TLS entrypoint. Set EASYBOT_DOMAIN to a public DNS name whose
  # A/AAAA records point to this host, then enable the production-tls profile.
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - production-tls
    environment:
      - EASYBOT_DOMAIN=${EASYBOT_DOMAIN:-gateway.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M
    restart: unless-stopped
    depends_on:
      easybot:
        condition: service_healthy
    networks:
      - frontend

  easybot:
    build: .
    ports:
      # Loopback by default: a host-level TLS proxy may forward to this port.
      # A proxy container on `frontend` should use http://easybot:8080 and can
      # remove this mapping entirely. Never bind 0.0.0.0 without a firewall.
      - "${EASYBOT_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      # 容器化配置（server.host: 0.0.0.0），保证 -p 端口发布在宿主机可达；
      # 不使用根目录 gateway.yaml（其 host 为 127.0.0.1，容器内回环绑定对外不可达）。
      - ./deploy/gateway.container.yaml:/etc/easybot/gateway.yaml:ro
      - easybot_data:/var/lib/easybot/data
    environment:
      - EASYBOT_HOME=/var/lib/easybot
      - EASYBOT_ENV=${EASYBOT_ENV:-}
      - EASYBOT_ALLOW_PLAINTEXT=${EASYBOT_ALLOW_PLAINTEXT:-}
      - EASYBOT_ADMIN_PASSWORD_FILE
      - EASYBOT_ADMIN_PASSWORD
      - DATABASE_URL_FILE
      - DATABASE_URL
      # SECURITY: Use file-based secrets (Docker secrets / bind mounts) instead
      # of env vars in production. Env vars are visible via docker inspect.
      - TELEGRAM_BOT_TOKEN_FILE
      - TELEGRAM_BOT_TOKEN
      - DISCORD_BOT_TOKEN_FILE
      - DISCORD_BOT_TOKEN
      - FEISHU_APP_ID_FILE
      - FEISHU_APP_ID
      - FEISHU_APP_SECRET_FILE
      - FEISHU_APP_SECRET
      - QQ_CLIENT_SECRET_FILE
      - QQ_CLIENT_SECRET
      - QQ_APP_ID_FILE
      - QQ_APP_ID
    # SECURITY: Drop all capabilities, prevent privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SECURITY: Read-only root filesystem (write only to /tmp and data volume)
    read_only: true
    tmpfs:
      - /tmp:size=128M
      - /var/lib/easybot/logs:size=64M
      - /var/lib/easybot/plugins:size=16M
      - /var/lib/easybot/certs:size=16M
      - /var/lib/easybot/secrets:size=16M
    restart: unless-stopped
    # SECURITY: Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      # Liveness must not restart the process merely because an external IM
      # platform is unavailable. Load balancers should use /api/v1/ready.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend

  postgres:
    # Pin the multi-architecture index so both amd64 and arm64 Docker hosts
    # resolve the same PostgreSQL release.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: easybot
      POSTGRES_USER: easybot
      # SECURITY: Require explicit password (no default). Set POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password is required. Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybot"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres
    restart: unless-stopped
    networks:
      - backend

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:v2.55.0@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
    ports:
      - "${EASYBOT_BIND_ADDRESS:-127.0.0.1}:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./easybot-alerts.yml:/etc/prometheus/easybot-alerts.yml:ro
      # Create a metricsread-only API key and put the raw token in this file.
      - ${EASYBOT_METRICS_TOKEN_FILE:-./secrets/easybot-metrics-token}:/run/secrets/easybot_metrics_token:ro
    profiles:
      - monitoring
    restart: unless-stopped
    networks:
      - frontend

# SECURITY: Separate frontend (internet-facing) and backend (internal) networks
networks:
  frontend:
  backend:
    internal: true

volumes:
  easybot_data:
  pg_data:
  caddy_data:
  caddy_config:
