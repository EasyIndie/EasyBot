version: 2
updates:
  # ── Rust/Cargo dependencies ──────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # 0.3.13 新增 `p256 ^0.13` → elliptic-curve 0.13 → crypto-bigint 0.5.5，而 crypto-bigint
      # 的 advisory 要求 >= 0.7.6（p256 0.13 的 `^0.5` 范围到不了）。在 `audit` 是必需检查的
      # 前提下它无法合并，精确忽略这一版；0.3.14+ 仍会正常提 PR（上游换掉 p256 后即可升级）。
      - dependency-name: "larksuite-oapi-sdk-rs"
        versions: [">= 0.3.13, < 0.3.14"]
      # 0.13 把 MSRV 抬到 Rust 1.95，超过本仓库声明的 `rust-version = "1.94"`；
      # 0.12 系列继续收 patch。
      - dependency-name: "parking_lot"
        versions: [">= 0.13.0, < 0.14.0"]
      # 0.40.1 无条件调用 `libc::statx` 读取 GPU 设备属性，而 libc 只在
      # `target_env = "gnu"` / android / musl v1.2.3（需显式开启 unstable cfg）下提供该符号
      # → 本仓库的主发布产物（x86_64/aarch64 musl 静态二进制）全部编译失败。
      # 上游尚未修复（master 仍是同一段代码），等 0.41+ 再升。
      - dependency-name: "sysinfo"
        versions: [">= 0.40.0, < 0.41.0"]
    groups:
      # twilight 的每个 crate 之间是硬依赖（`twilight-gateway` 内部依赖同版本的
      # `twilight-http` / `twilight-model`），major 必须成组升级：单独升其中一两个会让
      # 同一 crate 出现两个版本，`cargo deny` 的 `multiple-versions = "deny"` 直接拦下。
      # 必须排在 `cargo-minor-patch` 之前（先匹配者生效）。
      twilight:
        applies-to: version-updates
        patterns: ["twilight-*"]
      # 所有 minor/patch 升级合并成**一个** PR；major 仍单独成 PR（需要人工评审）。
      #
      # 这不只是省 CI：`audit` 是分支保护的必需检查，而 dependabot 默认「一依赖一 PR」。
      # 当 RustSec 一次公布多条 advisory（2026-10-09 那次是 14 条）时，任何单个 PR 都只
      # 修一条，`audit` 永远无法转绿 → 所有依赖 PR 互相死锁（2026-11-10 实际发生过）。
      # 分组后一轮升级只产生一个 PR，可一次清完全部 advisory。
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          # larksuite 0.3.13 新增 `p256 ^0.13` → elliptic-curve 0.13 → crypto-bigint 0.5.5，
          # 而 crypto-bigint 已进入 advisory（需 >= 0.7.6，p256 0.13 的 ^0.5 范围到不了）。
          # 升上去会直接把 `audit` 弄红，故踢出分组、单独成 PR 跟踪：等上游换掉 p256
          # 再合；免得一条被卡的依赖把整组的合法升级（本次是 `aes`）一起挡住。
          - "larksuite-oapi-sdk-rs"

  # ── GitHub Actions updates ──────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Actions 版本升级已全部固定为 40 位 SHA，成组更新可把 5~6 个 PR 收敛为 1 个。
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # ── 前端 npm（仅开发依赖，crates/easybot-api/templates） ─────────────
  # 该目录此前没有 version-updates 配置，只靠 security updates 兜底触发，
  # 导致 vite/vitest/minimatch 之类只能等安全通告才升级。
  - package-ecosystem: "npm"
    directory: "/crates/easybot-api/templates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
