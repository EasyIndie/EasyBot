name: Docker Buildx Setup
description: >
  Set up Docker Buildx, lower-case the repository name, log in to GHCR, and extract
  metadata (tags + labels). Callers access outputs via steps.<id>.outputs.<name>.

inputs:
  registry:
    description: "Container registry hostname"
    required: false
    default: ghcr.io
  tags:
    description: "Metadata tag rules (multi-line, same format as docker/metadata-action)"
    required: false
    default: |
      type=ref,event=branch
      type=semver,pattern={{version}}
      type=semver,pattern={{major}}.{{minor}}
      type=sha,prefix=,suffix=,format=short
      type=raw,value=latest,enable={{is_default_branch}}
  description:
    description: "Image description. Set as an OCI label and an index-level annotation; GHCR surfaces the annotation as the package description on the container page."
    required: false
    default: "EasyBot — 即时通信网关：统一接入 Telegram / Discord / 飞书 / QQ / 微信，提供 REST + WebSocket API、会话管理、消息编辑/删除与插件系统。快速开始：docker run -d --name easybot -p 127.0.0.1:8080:8080 -v easybot-data:/var/lib/easybot -e EASYBOT_HOME=/var/lib/easybot -e EASYBOT_ALLOW_PLAINTEXT=true -e EASYBOT_ADMIN_PASSWORD=更换为强密码 ghcr.io/easyindie/easybot:latest，然后访问 http://127.0.0.1:8080。完整部署指南见仓库 README 与 docs/01 user-guide.md。"

outputs:
  lower-repo:
    description: "Lowercase repository name for GHCR"
    value: ${{ steps.lower.outputs.repo }}
  meta-tags:
    description: "Docker metadata tags (newline-separated)"
    value: ${{ steps.meta.outputs.tags }}
  meta-labels:
    description: "Docker metadata labels"
    value: ${{ steps.meta.outputs.labels }}
  meta-annotations:
    description: "Docker OCI annotations (index-level), including the image description"
    value: ${{ steps.annotations.outputs.annotations }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Lowercase repository name for GHCR
      id: lower
      shell: bash
      run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ inputs.registry }}/${{ steps.lower.outputs.repo }}
        tags: ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.description=${{ inputs.description }}

    # GHCR reads the package description from an index-level OCI annotation,
    # not from per-platform image labels. Emit the annotation for callers to
    # pass to docker/build-push-action.
    - name: Emit OCI annotations (GHCR package description)
      id: annotations
      shell: bash
      run: |
        echo "annotations=index:org.opencontainers.image.description=${{ inputs.description }}" >> "$GITHUB_OUTPUT"
