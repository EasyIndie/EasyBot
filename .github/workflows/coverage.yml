name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # secrets context 不能出现在 if 表达式（job/step 级均解析失败）→ 经 job env 中转，step if 判空。
      # 未配置 → CODECOV_TOKEN 为空串 → 上传步骤跳过（工作流绿 = Codecov 尚未启用）；
      # 配置后上传失败（token 过期／网络／分支保护策略）仍会红灯告警（fail_ci_if_error: true）。
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        id: rust-setup
        with:
          install-protoc: auto
          cache-shared-key: "coverage-ubuntu"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-llvm-cov

      - name: Build ipc-mock-plugin
        run: bash scripts/ci-step.sh "coverage ipc-mock-plugin" cargo build -p ipc-mock-plugin --locked

      - name: Build CLI test binary
        run: bash scripts/ci-step.sh "coverage CLI binary" cargo build -p easybot-bin --bin easybot --features "default,plugin-system" --locked

      - name: Generate code coverage
        run: bash scripts/ci-step.sh "llvm-cov" cargo llvm-cov --workspace --features "default,plugin-system" --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: Coverage upload skipped (CODECOV_TOKEN not configured)
        if: ${{ env.CODECOV_TOKEN == '' }}
        shell: bash
        run: |
          echo "::notice title=Codecov upload skipped::CODECOV_TOKEN is not configured — lcov.info was generated but not uploaded."
          {
            echo "### Coverage upload skipped"
            echo ""
            echo "\`CODECOV_TOKEN\` is not configured, so \`lcov.info\` was generated but not uploaded to Codecov."
            echo "Run \`gh secret set CODECOV_TOKEN\` (or set it in Settings → Secrets) to enable the Codecov gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache summary
        if: always()
        shell: bash
        run: |
          echo "Rust cache exact hit: ${{ steps.rust-setup.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
