name: Docker

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, "crates/**", "bin/**"]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR 验证：仅编译 release mode + amd64 ──
  build-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 校验用构建刻意关掉 fat LTO / 单 codegen unit：Cargo.toml 的
      # [profile.release] 是给发行产物用的，fat LTO + codegen-units=1 让
      # 每次 PR 的 release 编译要 5 分钟以上（PR 关键路径）。这里只验证
      # 「Dockerfile 仍能构建、二进制仍能链接」，真正的 fat-LTO 产物由
      # main 的 build-amd64/arm64 与 release.yml 的 container-preflight 覆盖。
      - name: Build (validation only — no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE_RELEASE_LTO=false
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          # 显式 scope：默认 scope 按 ref 隔离，PR 之间、PR 与 main 之间互不
          # 复用层缓存；固定 scope 后所有 PR 共用一份（docs-only 等改动的
          # 构建可秒级命中）。
          cache-from: type=gha,scope=easybot-build-pr
          cache-to: type=gha,mode=max,scope=easybot-build-pr

  # ── amd64: 原生 x64 构建 ──
  build-amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/docker-setup
        id: docker-prep

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: ${{ steps.docker-prep.outputs.meta-labels }}
          cache-from: type=gha,scope=easybot-amd64
          cache-to: type=gha,mode=max,scope=easybot-amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.docker-prep.outputs.lower-repo }},push-by-digest=true

  # ── arm64: 原生 ARM 构建（GitHub 原生 ARM runner） ──
  build-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/docker-setup
        id: docker-prep

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          labels: ${{ steps.docker-prep.outputs.meta-labels }}
          cache-from: type=gha,scope=easybot-arm64
          cache-to: type=gha,mode=max,scope=easybot-arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.docker-prep.outputs.lower-repo }},push-by-digest=true

  # ── Merge: 组合 multi-arch manifest 并打标签推送 ──
  merge:
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # secrets context 不能出现在 if 表达式（job/step 级均解析失败）→ 经 job env 中转，step if 判空。
      GHCR_TOKEN: ${{ secrets.GHCR_PRUNE_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/docker-setup
        id: docker-prep

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE="${{ steps.docker-prep.outputs.lower-repo }}"
          DIGEST_AMD64="${{ needs.build-amd64.outputs.digest }}"
          DIGEST_ARM64="${{ needs.build-arm64.outputs.digest }}"
          TAGS="${{ steps.docker-prep.outputs.meta-tags }}"
          ANNOTATION="${{ steps.docker-prep.outputs.meta-annotations }}"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest: $tag"
            # --annotation on the merged index is what GHCR reads for the package description.
            docker buildx imagetools create \
              --annotation "$ANNOTATION" \
              -t "$tag" \
              "${REGISTRY}/${IMAGE}@${DIGEST_AMD64}" \
              "${REGISTRY}/${IMAGE}@${DIGEST_ARM64}"
          done <<< "$TAGS"

      # ── M1 保留策略 reconcile：新 main 树已推，清扫被取代的 sha7 树/孤儿/幽灵条目 ──
      # 不变量：GHCR 仅含全部正式 release 树 + 当前 main/latest 树。幂等、默认 dry-run。
      # 需 org 级 delete:packages token（repo GITHUB_TOKEN 无权删 org 级包），未配则跳过。
      # best-effort：镜像发布是热路径，清扫失败不应使其变红——残留由下次成功自愈 + ghcr-prune.yml 兜底。
      - name: Reconcile GHCR retention
        if: ${{ env.GHCR_TOKEN != '' }}
        continue-on-error: true
        run: python3 scripts/ghcr-reconcile.py --apply
