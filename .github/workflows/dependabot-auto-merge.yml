name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 60
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch/minor dependency bumps are safe to auto-merge once the
      # required checks (full CI + merge queue) pass. Major bumps stay
      # manual — they can carry breaking changes.
      #
      # 为什么不用 `gh pr merge --auto`：`main` 的 ruleset 启用了 merge queue
      # （SQUASH）。实测 `--auto` 只会写下 autoMergeRequest，**GitHub 从不把 PR 放进
      # 队列**（#195 从 11-16 起带着 auto-merge、检查全绿仍一直停在 OPEN），所以这里
      # 直接调 GraphQL `enqueuePullRequest`。
      #
      # 但入队前 GitHub 会校验 14 项必需检查全部成功，刚创建的 PR 立刻入队必然被
      # `UNPROCESSABLE: Pull request 13 of 14 required status checks have not
      # succeeded` 拒绝（2026-11 实测 #205 / #206）—— 因此这里必须**等检查跑完再入队**，
      # 否则会退化成和 `--auto` 一样的“永不合并”。
      - name: Enqueue into the merge queue (retry until required checks pass)
        if: |
          github.event.pull_request.state == 'open' &&
          !github.event.pull_request.draft &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # 不用 mergeStateStatus 当判据：本 job 自身也是一个 check，等它变成 CLEAN 会
          # **自锁死**（2026-11 实测 #205 / #206：唯一 pending 的检查就是 `dependabot` 自己）。
          # 改成反复调 enqueue，由 GitHub 用它自己的必需检查清单给结论：未就绪时返回
          # `required status checks have not succeeded`，就绪即入队。
          for i in $(seq 1 40); do
            if out=$(gh api graphql \
              -f query='mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
              -f id="$PR_ID" 2>&1); then
              echo "已加入 merge queue（第 $i 次尝试）：$out"
              exit 0
            fi
            case "$out" in
              *"required status checks have not succeeded"*|*"not mergeable"*|*"still in progress"*)
                echo "第 $i/40 次：必需检查尚未全部通过，45s 后重试" ;;
              *"is closed"*|*"already in the merge queue"*|*"already queued"*)
                echo "无需入队：$out"; exit 0 ;;
              *)
                echo "::warning::enqueue 失败，交人工处理：$out"; exit 0 ;;
            esac
            sleep 45
          done
          echo "::warning::等待 30 分钟后仍未入队，请人工检查：$PR_URL"
