name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 60
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch/minor dependency bumps are safe to auto-merge once the
      # required checks (full CI + merge queue) pass. Major bumps stay
      # manual — they can carry breaking changes.
      #
      # 为什么不用 `gh pr merge --auto`：`main` 的 ruleset 启用了 merge queue
      # （SQUASH）。实测 `--auto` 只会写下 autoMergeRequest，**GitHub 从不把 PR 放进
      # 队列**（#195 从 11-16 起带着 auto-merge、检查全绿仍一直停在 OPEN），所以这里
      # 直接调 GraphQL `enqueuePullRequest`。
      #
      # 但入队前 GitHub 会校验 14 项必需检查全部成功，刚创建的 PR 立刻入队必然被
      # `UNPROCESSABLE: Pull request 13 of 14 required status checks have not
      # succeeded` 拒绝（2026-11 实测 #205 / #206）—— 因此这里必须**等检查跑完再入队**，
      # 否则会退化成和 `--auto` 一样的“永不合并”。
      - name: Wait for required checks, then enqueue into the merge queue
        if: |
          github.event.pull_request.state == 'open' &&
          !github.event.pull_request.draft &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # CLEAN = 与 base 同步且必需检查全过；BLOCKED/UNKNOWN = 检查仍在跑；
          # BEHIND = base 前进后需要 dependabot 重新 rebase（继续等）。
          for i in $(seq 1 40); do
            state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            case "$state" in
              CLEAN) echo "必需检查已全部通过（第 $i 次轮询），开始入队"; break ;;
              DIRTY)
                echo "::warning::$PR_URL 存在冲突，跳过自动入队，需人工处理"
                exit 0
                ;;
              *) echo "第 $i/40 次：mergeStateStatus=$state，等待必需检查…"; sleep 45 ;;
            esac
          done

          if [ "${state:-}" != "CLEAN" ]; then
            echo "::warning::等待 30 分钟后仍未通过必需检查（最后状态 $state），请人工检查后再入队：$PR_URL"
            exit 0
          fi

          if out=$(gh api graphql \
            -f query='mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
            -f id="$PR_ID" 2>&1); then
            echo "已加入 merge queue：$out"
          else
            echo "::warning::enqueue 未成功（可能已在队列中或检查刚失效），请人工确认：$out"
          fi
