name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "crates/easybot-api/templates/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "crates/easybot-api/templates/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/easybot-api/templates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/easybot-api/templates/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
