name: Platform Matrix

on:
  workflow_call:
    inputs:
      operation:
        description: "Run target checks or build release artifacts"
        required: true
        type: string
      version:
        description: "Release version applied before artifact builds"
        required: false
        default: ""
        type: string
    secrets:
      APPLE_DEVELOPER_ID_CERT_BASE64:
        required: false
      APPLE_DEVELOPER_ID_CERT_PASSWORD:
        required: false
      APPLE_NOTARY_API_KEY_BASE64:
        required: false
      APPLE_NOTARY_API_KEY_ID:
        required: false
      APPLE_NOTARY_API_ISSUER:
        required: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  targets:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            macos-deployment-target: "10.15"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            macos-deployment-target: "11.0"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: ".exe"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/apply-version-bump
        if: inputs.operation == 'build'
        with:
          version: ${{ inputs.version }}

      - uses: ./.github/actions/setup-rust
        id: rust-setup
        with:
          target: ${{ matrix.target }}
          components: clippy
          install-protoc: auto
          install-zigbuild: ${{ contains(matrix.target, 'musl') }}
          cache-shared-key: platform-${{ inputs.operation }}-${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check target
        if: inputs.operation == 'check' && !contains(matrix.target, 'musl')
        run: bash scripts/ci-step.sh "target check" cargo clippy --workspace --features "default,plugin-system" --target ${{ matrix.target }} --locked -- -D warnings

      # musl dependencies such as ring and aws-lc-sys compile C sources.
      # Validate the release binary with zigbuild's cross C toolchain.
      - name: Check target (musl)
        if: inputs.operation == 'check' && contains(matrix.target, 'musl')
        run: bash scripts/ci-step.sh "musl target check" cargo zigbuild --bin easybot --features "default,plugin-system" --target ${{ matrix.target }} --locked

      - name: Check cache summary
        if: inputs.operation == 'check' && always()
        shell: bash
        run: |
          echo "Rust cache exact hit: ${{ steps.rust-setup.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release binary (musl)
        if: inputs.operation == 'build' && contains(matrix.target, 'musl')
        run: cargo zigbuild --bin easybot --release --features "default,plugin-system" --target ${{ matrix.target }} --locked

      - name: Build release binary (native)
        if: inputs.operation == 'build' && !contains(matrix.target, 'musl')
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target || '' }}
        run: cargo build --release --features "default,plugin-system" --target ${{ matrix.target }} --locked

      # 签名/公证逻辑与 release.yml 共用同一个 composite action（单一来源）。
      # 历史实现在此额外调用了 `xcrun stapler staple` —— 裸 Mach-O 不支持 stapling，
      # 配置凭据后会直接失败，已随本次收敛一并移除。
      - name: Sign and notarize macOS binary
        if: inputs.operation == 'build' && contains(matrix.target, 'apple-darwin')
        uses: ./.github/actions/macos-sign-notarize
        with:
          binary: target/${{ matrix.target }}/release/easybot${{ matrix.suffix }}
          cert-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          cert-password: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          notary-api-key: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          notary-key-id: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          notary-issuer: ${{ secrets.APPLE_NOTARY_API_ISSUER }}

      - name: Prepare artifact
        if: inputs.operation == 'build'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/easybot${{ matrix.suffix }}"
          ARCHIVE="easybot-${{ matrix.target }}${{ matrix.suffix }}"
          cp "$BINARY" "$ARCHIVE"

      - name: Upload artifact
        if: inputs.operation == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: easybot-${{ matrix.target }}
          path: easybot-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error
