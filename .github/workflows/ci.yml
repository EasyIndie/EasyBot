name: CI

on:
  push:
    branches: [main, "release/*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  merge_group:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint: fmt only, no compilation (~20s) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  # ── Test: clippy → build → test (merged check + test-default + test-all) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        id: rust-setup
        with:
          components: clippy, rustfmt
          install-protoc: auto
          cache-shared-key: "test-ubuntu"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: bash scripts/ci-step.sh "clippy" cargo clippy --workspace --features "default,plugin-system" --all-targets --locked -- -D warnings

      - name: Build mock-adapter
        run: bash scripts/ci-step.sh "mock-adapter build" cargo build -p mock-adapter --locked

      - name: Build CLI test binary
        run: bash scripts/ci-step.sh "CLI binary build" cargo build -p easybot-bin --bin easybot --features "default,plugin-system" --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-nextest

      - name: Test
        run: bash scripts/ci-step.sh "nextest" cargo nextest run --workspace --features "default,plugin-system" --locked

      - name: Cache summary
        if: always()
        shell: bash
        run: |
          echo "Rust cache exact hit: ${{ steps.rust-setup.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Feature matrix: validate edge feature combinations ─────────────
  feature-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: "--no-default-features"
            protoc: "auto"
            cache-key: "feature-minimal"
          - features: "--no-default-features --features adapter-telegram,adapter-discord"
            protoc: "auto"
            cache-key: "feature-chat"
          - features: "--no-default-features --features adapter-feishu,adapter-qq,adapter-wechat"
            protoc: "auto"
            cache-key: "feature-platform"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          install-protoc: ${{ matrix.protoc }}
          cache-shared-key: ${{ matrix.cache-key }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check (${{ matrix.features }})
        run: bash scripts/ci-step.sh "feature check" cargo check --workspace ${{ matrix.features }} --locked

  # ── Disaster recovery: backup integrity and restore drill ──────────
  disaster-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SQLite backup, tamper detection and restore
        run: bash scripts/test-backup.sh

  # ── Cross-platform check (Linux/macOS/Windows × x64/arm64) ──
  cross-check:
    uses: ./.github/workflows/platform-matrix.yml
    with:
      operation: check
