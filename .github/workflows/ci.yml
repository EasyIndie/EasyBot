name: CI

on:
  push:
    branches: [main, "release/*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  merge_group:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint: fmt only, no compilation (~20s) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  # ── Test: clippy → build → test (merged check + test-default + test-all) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          install-protoc: auto
          cache-shared-key: "test-ubuntu"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --features "default,plugin-system" --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --features "default,plugin-system" --locked

      - name: Build mock-adapter
        run: cargo build -p mock-adapter --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --features "default,plugin-system" --locked

  # ── Feature matrix: validate edge feature combinations ─────────────
  feature-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: "--no-default-features"
            protoc: "auto"
          - features: "--no-default-features --features adapter-telegram,adapter-discord"
            protoc: "auto"
          - features: "--no-default-features --features adapter-feishu,adapter-qq,adapter-wechat"
            protoc: "auto"
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-rust
        with:
          install-protoc: ${{ matrix.protoc }}
          cache-shared-key: "feature-check"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check (${{ matrix.features }})
        run: cargo check --workspace ${{ matrix.features }} --locked

  # ── Disaster recovery: backup integrity and restore drill ──────────
  disaster-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: SQLite backup, tamper detection and restore
        run: bash scripts/test-backup.sh

  # ── Cross-platform check (Linux/macOS/Windows × x64/arm64) ──
  cross-check:
    uses: ./.github/workflows/platform-matrix.yml
    with:
      operation: check

  # ── Code coverage ───────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-rust
        with:
          install-protoc: auto

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-llvm-cov

      - name: Build workspace (for integration tests)
        run: cargo build --workspace --features "default,plugin-system" --locked

      - name: Build mock-adapter
        run: cargo build -p mock-adapter --locked

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --features "default,plugin-system" --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
