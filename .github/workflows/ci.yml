name: CI

on:
  push:
    branches: [main, "release/*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint: fmt only, no compilation (~20s) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  # ── Clippy: 独立作业，与 test 并行（见 CHANGELOG「CI 迭代耗时」） ──
  #
  # 独立成作业的理由：
  # - clippy 的编译产物（clippy-driver 产出的 metadata）与 nextest 需要的
  #   codegen 产物不是同一批，放在同一个作业里串行执行时，PR 关键路径 =
  #   clippy + 构建 + nextest（冷跑 7–10 分钟）；拆开并行后 = max(两者)。
  # - 独立缓存键（clippy-ubuntu）：两个作业同时写同一个 shared-key 会互相
  #   覆盖（rust-cache 后写者赢），拆键也避免 clippy 作业读到只有 rustc 产物的
  #   缓存后仍需从零过一遍 clippy driver。
  test-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        id: rust-setup
        with:
          components: clippy
          install-protoc: auto
          cache-shared-key: "clippy-ubuntu"
          cache-save-if: "true"

      - name: Clippy
        run: bash scripts/ci-step.sh "clippy" cargo clippy --workspace --features "default,plugin-system" --all-targets --locked -- -D warnings

      - name: Cache summary
        if: always()
        shell: bash
        run: |
          echo "Rust cache exact hit: ${{ steps.rust-setup.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Test: build → nextest（clippy 已拆到 test-clippy） ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        id: rust-setup
        with:
          install-protoc: auto
          cache-shared-key: "test-ubuntu"
          # 允许 PR 分支保存缓存：cache 按分支隔离，main 的缓存 PR 可读、PR 自己
          # 的缓存不会被其它分支读到 —— 于是「同一 PR 的第 2 次及以后 push」
          # 只需增量编译。main 的缓存条目仍由 main 自己的运行写入，不会被 PR 覆盖。
          cache-save-if: "true"

      - name: Build ipc-mock-plugin
        run: bash scripts/ci-step.sh "ipc-mock-plugin build" cargo build -p ipc-mock-plugin --locked

      - name: Build CLI test binary
        run: bash scripts/ci-step.sh "CLI binary build" cargo build -p easybot-bin --bin easybot --features "default,plugin-system" --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest

      - name: Test
        run: bash scripts/ci-step.sh "nextest" cargo nextest run --workspace --features "default,plugin-system" --locked

      - name: Cache summary
        if: always()
        shell: bash
        run: |
          echo "Rust cache exact hit: ${{ steps.rust-setup.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Feature matrix: validate edge feature combinations ─────────────
  feature-check:
    name: feature-check (${{ matrix.label }})
    # merge queue 已经在合并前的确切代码树上跑过该矩阵，push 到 main 时再跑一遍
    # 纯属重复（每次 merge 白烧 3 个 runner × 约 3 分钟）。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - label: minimal
            features: "--no-default-features"
            protoc: "auto"
            cache-key: "feature-minimal"
          - label: chat
            features: "--no-default-features --features adapter-telegram,adapter-discord"
            protoc: "auto"
            cache-key: "feature-chat"
          - label: platform
            features: "--no-default-features --features adapter-feishu,adapter-qq,adapter-wechat"
            protoc: "auto"
            cache-key: "feature-platform"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          install-protoc: ${{ matrix.protoc }}
          cache-shared-key: ${{ matrix.cache-key }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check (${{ matrix.features }})
        run: bash scripts/ci-step.sh "feature check" cargo check --workspace ${{ matrix.features }} --locked

  # ── Disaster recovery: backup integrity and restore drill ──────────
  disaster-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SQLite backup, tamper detection and restore
        run: bash scripts/test-backup.sh

  # ── Cross-platform check (Linux/macOS/Windows × x64/arm64) ──
  cross-check:
    # 同上：6 个平台的交叉编译检查由 merge queue 在合并前保证，
    # push 到 main 时重复执行每次约 6.5 分钟 × 6 个 runner。
    if: github.event_name != 'push'
    uses: ./.github/workflows/platform-matrix.yml
    with:
      operation: check
