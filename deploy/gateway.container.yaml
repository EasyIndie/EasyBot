# EasyBot 容器化运行的基础配置（发布镜像内置，可被挂载覆盖）。
#
# 应用监听器仅支持 HTTP。容器内绑定 0.0.0.0 以便 `-p` 端口发布可达；
# 宿主机侧请映射到 127.0.0.1，或置于可信 TLS 反向代理 / 防火墙之后，
# 并按 docs/01 说明设置 EASYBOT_ALLOW_PLAINTEXT=true 确认该 HTTP 跳转。
server:
  host: "0.0.0.0"
  port: 8080

# 容器内推荐 stdout：由 Docker 的 json-file 驱动 + log-opts 轮转（见 docs/01）。
# 镜像已内置 tzdata，`-e TZ=Asia/Shanghai` 会让时间戳变成 +08:00。
logging:
  level: "info"
  format: "text"
  output: "stdout"
  timezone: "local"
