services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      EASYBOT_DOMAIN: ${EASYBOT_DOMAIN:?Public EasyBot domain is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    restart: unless-stopped
    depends_on:
      easybot:
        condition: service_healthy
    networks: [frontend]

  easybot:
    image: ${EASYBOT_IMAGE:?Immutable EasyBot image digest is required}
    pull_policy: always
    environment:
      EASYBOT_HOME: /var/lib/easybot
      EASYBOT_ENV: production
      EASYBOT_ALLOW_PLAINTEXT: "true"
      EASYBOT_ADMIN_PASSWORD_FILE: ${EASYBOT_ADMIN_PASSWORD_FILE:-/run/secrets/admin_password}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/database_url}
      TELEGRAM_BOT_TOKEN_FILE: ${TELEGRAM_BOT_TOKEN_FILE:-}
      DISCORD_BOT_TOKEN_FILE: ${DISCORD_BOT_TOKEN_FILE:-}
      FEISHU_APP_ID_FILE: ${FEISHU_APP_ID_FILE:-}
      FEISHU_APP_SECRET_FILE: ${FEISHU_APP_SECRET_FILE:-}
      QQ_APP_ID_FILE: ${QQ_APP_ID_FILE:-}
      QQ_CLIENT_SECRET_FILE: ${QQ_CLIENT_SECRET_FILE:-}
    volumes:
      - ../gateway.yaml:/etc/easybot/gateway.yaml:ro
      - ${EASYBOT_SECRETS_DIR:?Absolute secrets directory is required}:/run/secrets:ro
      - ${EASYBOT_DATA_DIR:?Absolute EasyBot data directory is required}:/var/lib/easybot/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=128M
      - /var/lib/easybot/logs:size=64M
      - /var/lib/easybot/plugins:size=16M
      - /var/lib/easybot/certs:size=16M
      - /var/lib/easybot/secrets:size=16M
    pids_limit: 512
    mem_limit: 512m
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/live]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
