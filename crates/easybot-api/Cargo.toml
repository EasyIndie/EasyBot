[package]
name = "easybot-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
easybot-core = { path = "../easybot-core" }

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dashmap.workspace = true
futures.workspace = true
prometheus.workspace = true
regex.workspace = true
reqwest.workspace = true
uuid.workspace = true
sha2.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }
# `vendored`：Swagger UI 的 dist 由 `utoipa-swagger-ui-vendored` 以字节内嵌，
# 构建期不再 `curl` 下载 swagger-ui zip。原实现在每次 `cargo build`（含 CI、
# 离线/受限网络环境）都要访问 GitHub CDN —— 一次 TLS reset 就让 build script
# 失败，PR #228 因此在 merge queue 里被弹回（utoipa-swagger-ui build.rs exit 56）。
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }

[features]
default = []
plugin-system = ["easybot-core/plugin-system"]

[build-dependencies]
pulldown-cmark = "0.13"
regex = "1"
base64.workspace = true

[dev-dependencies]
tower.workspace = true
sqlx = { workspace = true }
http-body-util = "0.1"
tokio-tungstenite = { workspace = true, features = ["connect"] }
insta = { version = "1", features = ["json"] }

[lints]
workspace = true
