[package]
name = "easybot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
integration-test = []
plugin-system = ["dep:libloading", "dep:ed25519-dalek", "dep:getrandom"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait.workspace = true
dashmap.workspace = true
tracing.workspace = true
futures.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
sqlx.workspace = true
regex.workspace = true
dirs.workspace = true
dotenvy.workspace = true
argon2.workspace = true
rand_core = { version = "0.9", features = ["os_rng"] }
# rand_core 0.6 via password-hash: OsRng needs getrandom feature（argon2 0.5 依赖；argon2 0.6 迁移后可删）
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
ed25519-dalek = { workspace = true, optional = true }
# ed25519-dalek 3.x 密钥生成 CSPRNG（rand_core 0.10 系；sys_rng 开启 SysRng + rand_core 重导出）
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
reqwest.workspace = true
libloading = { workspace = true, optional = true }
utoipa = { workspace = true }
sysinfo.workspace = true
semver.workspace = true
url.workspace = true

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
