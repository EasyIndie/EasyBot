[package]
name = "easybot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
integration-test = []
plugin-system = ["dep:ed25519-dalek", "dep:getrandom", "dep:easybot-plugin-protocol"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
async-trait.workspace = true
dashmap.workspace = true
tracing.workspace = true
futures.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
sqlx.workspace = true
regex.workspace = true
dirs.workspace = true
dotenvy.workspace = true
argon2.workspace = true
# 注意：CSPRNG 统一经 `getrandom::rand_core`（0.10 系）重导出使用，
# 不再直接依赖 rand_core（避免与 ed25519-dalek 3.x 链路的 0.10 版本重复）。
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
ed25519-dalek = { workspace = true, optional = true }
# ed25519-dalek 3.x 密钥生成 CSPRNG（rand_core 0.10 系；sys_rng 开启 SysRng + rand_core 重导出）
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
reqwest.workspace = true
# 进程外插件协议（宿主侧 IPC 代理用）
easybot-plugin-protocol = { path = "../easybot-plugin-protocol", optional = true }
utoipa = { workspace = true }
sysinfo.workspace = true
semver.workspace = true
url.workspace = true

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
