# EasyBot — cargo-deny configuration
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
ignore = [
    # rustls-pemfile is unmaintained (RUSTSEC-2025-0134)
    # Pinned by transitive deps (rustls, aws-lc-rs); awaiting upstream migration
    "RUSTSEC-2025-0134",
    # libsqlite3-sys bundles SQLite < 3.54.0 (RUSTSEC-2026-0459 / CVE-2026-119375):
    # a crafted DB + sibling `-wal` file can make queries return uninitialized page-cache
    # memory. sqlx 0.9.0 pins `libsqlite3-sys >=0.30.1, <0.38.0`, so the patched 0.39 is
    # unreachable until an upstream sqlx release picks up rusqlite 0.41. Exposure requires
    # a local attacker able to write both files in the config directory; revisit on sqlx bump.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "deny"
skip = []
skip-tree = [
    # larksuite-oapi-sdk-rs pins an older tungstenite — upstream PR needed
    { name = "tokio-tungstenite", version = "0.26" },
    # Duplicate sha2 from transitive deps (argon2 vs others)
    { name = "sha2", version = "0.11" },
    # Duplicate rand/rand_core from transitive deps
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },
    { name = "webpki-roots", version = "0.26" },
    { name = "webpki-roots", version = "1.0" },
    { name = "digest", version = "0.11" },
    { name = "crypto-common", version = "0.2" },
    { name = "block-buffer", version = "0.10" },
    { name = "block-buffer", version = "0.12" },
    { name = "base64", version = "0.23" },
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.16" },
    { name = "linux-raw-sys", version = "0.4" },
    { name = "rustix", version = "0.38" },
    { name = "tokio-tungstenite", version = "0.29" },
    { name = "tower-http", version = "0.6" },
    { name = "tungstenite", version = "0.29" },
]
