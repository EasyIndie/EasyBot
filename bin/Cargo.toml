[package]
name = "easybot-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
easybot-core = { path = "../crates/easybot-core" }
easybot-api = { path = "../crates/easybot-api" }
# 供 plugin 子命令（scaffold/inspect）读取 SDK 常量（EASYBOT_PLUGIN_ABI_VERSION）
easybot-plugin-sdk = { path = "../crates/easybot-plugin-sdk" }
easybot-adapter-telegram = { path = "../crates/easybot-adapter-telegram", optional = true }
easybot-adapter-discord = { path = "../crates/easybot-adapter-discord", optional = true }
easybot-adapter-feishu = { path = "../crates/easybot-adapter-feishu", optional = true }
easybot-adapter-qq = { path = "../crates/easybot-adapter-qq", optional = true }
easybot-adapter-wechat = { path = "../crates/easybot-adapter-wechat", optional = true }

sqlx.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true
rustls = { version = "0.23", features = ["aws-lc-rs"] }
# ⚠ 禁用自定义全局分配器（FFI 分配器契约）：插件在进程内 dlopen，与宿主通过 FFI
# 收发 String/Vec/Value 等堆所有权（宿主分配→插件 Drop，或插件分配→宿主 Drop），
# 两侧必须共用同一全局分配器。**不要**在这里引入 mimalloc 等自定义 global_allocator：
#   宿主 mimalloc + 插件系统 malloc → 交叉 free → SIGABRT
#   插件各自静态链接 mimalloc     → 进程内两套 mimalloc 堆 → 析构死锁
# 详见 docs/plugin-development-guide.md「FFI 分配器契约」。

[features]
default = ["adapter-telegram", "adapter-discord", "adapter-feishu", "adapter-qq", "adapter-wechat"]
adapter-telegram = ["easybot-adapter-telegram"]
adapter-discord = ["easybot-adapter-discord"]
adapter-feishu = ["easybot-adapter-feishu"]
adapter-qq = ["easybot-adapter-qq"]
adapter-wechat = ["easybot-adapter-wechat"]
plugin-system = [
    "easybot-core/plugin-system",
    "easybot-api/plugin-system",
    # DX 测试宿主随 plugin-system 一并纳入 CI（否则 workspace 门禁不编译 SDK testing）
    "easybot-plugin-sdk/testing",
]

[[bin]]
name = "easybot"
path = "src/main.rs"

[lints]
workspace = true
